# 신호봇 공용 healthcheck: /tmp/hb(메인루프 하트비트)가 90s 이상 stale이면 = 메인루프
# 행(hang) → exit 1(unhealthy) 보고. 실제 재기동은 autoheal 사이드카가 docker restart로
# 수행(컨테이너 PID1=python은 네임스페이스 내부 kill로 못 죽임 → 데몬측 restart 필요).
# $$ = compose 변수보간 회피(런타임 쉘에 $ 전달).
x-signal-healthcheck: &signal-hc
  test: ["CMD-SHELL", "AGE=$$(( $$(date +%s) - $$(stat -c %Y /tmp/hb 2>/dev/null || echo 0) )); [ \"$$AGE\" -lt 90 ]"]
  interval: 20s
  timeout: 10s
  retries: 3
  start_period: 120s

# autoheal이 감시할 라벨
x-autoheal-label: &autoheal-label
  autoheal: "true"

services:

  # ─── Signal bots ────────────────────────────────────────────────────────────

  signal-bybit:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=bybit
      - BYBIT_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # S1(σ-복귀) 전략 — 큰틀 동일, strategy=s1. namespace "s1"로 장부 분리, executor-a1 공유.
  signal-s1:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s1
      - S1_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-mt5:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=mt5
      # executor-a2는 로컬 Windows에서 실행 → host.docker.internal로 접근
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # S1(σ-복귀) v2 — MT5. strategy=s1, namespace "mt5"(signal-mt5와 장부 공유, tag=S1 구분), executor-a2(9010) 공유.
  signal-s1-mt5:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s1mt5
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # S2(추세 숏) — Bybit. strategy=s2, namespace "bybit" 공유, executor-a1.
  signal-s2:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s2
      - S2_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # S2(추세 숏) — MT5. strategy=s2, namespace "mt5" 공유, executor-a2(9010).
  signal-s2-mt5:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s2mt5
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # ── 일봉(D1) FX 채널 (HANDOFF_DAILY_FX) — namespace fxd, executor-a2(9010) 공유 ──
  signal-fxd1:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=fxd1
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  signal-fxd2:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=fxd2
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # ── 일봉(D1) 크립토(Bybit) 채널 (HANDOFF_DAILY_MT5 §3b) — namespace cryptod, executor-a1(9009) ──
  #   📝 signal_only=True 페이퍼(app/main.py). 검증 후 라이브 승격.
  signal-cryptod1:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=cryptod1
      - CRYPTOD_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-cryptod2:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=cryptod2
      - CRYPTOD_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # ── 일봉(D1) MT5 비환율 채널 (HANDOFF_DAILY_MT5 §3) — namespace mt5d, executor-a2(9010) ──
  #   📝 signal_only=True 페이퍼. 사이징 2% 엄수.
  signal-mt5d1:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=mt5d1
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  signal-mt5d2:
    profiles: ["retired"]   # S33 일봉책 통합(signal-s33/s33m/s33f)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=mt5d2
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # ── S11 「1분봉책」 (HANDOFF_MASTER v4) — 구 S1/S2 대체. ns s11(Bybit, executor-a1)/s11m(MT5, a2) ──
  signal-s11t:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11t
      - S11_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s11r:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11r
      - S11_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s11f:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11f
      - S11_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s11mt:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11mt
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  signal-s11mf:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11mf
      - MT5_EXECUTOR_TARGETS=host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs

  # ── S22 「4시간봉책」 (HANDOFF_S22 2026-07-13) — Bybit 8셀, 진입 5%. ns s22, executor-a1 ──
  signal-s22t:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22t
      - S22_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s22r:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22r
      - S22_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s22e:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22e
      - S22_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s22f:
    profiles: ["retired"]   # 책 통합(signal-s11/s22/s11m)으로 대체 — 롤백용 봉인
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22f
      - S22_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # ── 책 통합 채널 (2026-07-14) — 셀 패밀리별 컨테이너를 책당 1프로세스로 통합. ──
  #   WS 1개 공유 + 쿨다운 태그별 분리 + 텔레그램 '전체 N'=책 유니버스.
  #   구 s11t/r/f·s22t/r/e/f·s11mt/mf는 retired 프로파일(위) — 롤백 시 프로파일만 해제.
  signal-s11:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11
      - S11_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  signal-s22:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22
      - S22_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # S11 MT5 확장판 통합 — executor-a2(Windows-native 127.0.0.1:9010) 접근은 wsl 오버레이(host net)가 지정
  signal-s11m:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s11m
      - S11M_EXECUTOR_TARGETS=host.docker.internal:9010
    volumes:
      - ./logs:/app/logs

  # ── S33 「일봉책」 통합 채널 (2026-07-15) — S3+S4를 유니버스당 1프로세스로. ──
  signal-s33:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s33
      - CRYPTOD_EXECUTOR_TARGETS=executor-a1:9009
    volumes:
      - ./logs:/app/logs
    depends_on:
      - executor-a1

  # MT5·FX 일봉책 — executor-a2 접근은 wsl 오버레이(host net)가 지정
  signal-s33m:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s33m
      - MT5D_EXECUTOR_TARGETS=host.docker.internal:9010
    volumes:
      - ./logs:/app/logs

  signal-s33f:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s33f
      - FXD_EXECUTOR_TARGETS=host.docker.internal:9010
    volumes:
      - ./logs:/app/logs

  # S22 확장판(4h MT5·FX) — executor-a2 접근은 wsl 오버레이(host net)가 지정
  signal-s22m:
    build: .
    restart: always
    healthcheck: *signal-hc
    labels: *autoheal-label
    command: python -m app.main
    env_file: .env
    environment:
      - STRATEGY=s22m
      - S22M_EXECUTOR_TARGETS=host.docker.internal:9010
    volumes:
      - ./logs:/app/logs

  # ─── Watchdog ───────────────────────────────────────────────────────────────
  # unhealthy(=하트비트 stale=메인루프 행) 컨테이너를 docker restart로 자동 복구.
  # 라벨 autoheal=true 인 컨테이너만 대상. 데몬측 restart라 행된 PID1도 확실히 종료.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10        # 10초마다 unhealthy 점검
      - AUTOHEAL_START_PERIOD=120   # 컨테이너 기동 후 120초는 유예
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ─── Executors ──────────────────────────────────────────────────────────────

  executor-a1:
    build: .
    restart: always
    command: python -m app.local_executor
    env_file: .env
    environment:
      - EXEC_ACCOUNT_ID=${EXEC_A1_ACCOUNT_ID}
      - EXEC_LISTEN_HOST=0.0.0.0
    volumes:
      - ./logs:/app/logs

  # executor-a2 (MT5 주문)는 MetaTrader5 Python 라이브러리가 Windows 전용이라
  # Linux Docker에서 실행 불가 → 로컬 Windows PyCharm에서 직접 실행 유지
